<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão APROTUNAS</title>
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f1; --surface:#ffffff; --surface2:#fbfcf9;
  --green:#2e7d32; --green-d:#1f5c24; --green-l:#e8f2e4;
  --earth:#8d6e3a; --amber:#e0a938;
  --text:#22281f; --muted:#6b7565; --line:#e2e7db; --line-d:#cdd5c3;
  --red:#c0392b; --red-l:#fbe9e7; --blue:#2c6e8f; --ok:#2e7d32;
  --radius:12px; --shadow:0 1px 3px rgba(30,50,20,.08),0 1px 2px rgba(30,50,20,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:600}
a{color:var(--green)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#2e7d32 0%,#1f5c24 100%)}
#login .card{background:var(--surface);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.2);
  padding:36px 32px;width:100%;max-width:400px}
#login .brand{text-align:center;margin-bottom:22px}
#login .brand .logo{width:64px;height:64px;border-radius:16px;background:var(--green-l);
  display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px}
#login h1{font-size:22px;color:var(--green-d)}
#login .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line-d);border-radius:9px;background:var(--surface2);outline:none}
.inp:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 3px var(--green-l)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:none;border-radius:9px;
  background:var(--green);color:#fff;font-weight:600;font-size:14px}
.btn:hover{background:var(--green-d)}
.btn.block{width:100%;padding:12px}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line-d)}
.btn.ghost:hover{background:var(--green-l)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.danger{background:var(--red)} .btn.danger:hover{background:#96271b}
.btn.amber{background:var(--amber);color:#3a2c05} .btn.amber:hover{background:#c9932c}
.err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px}
.rastbox{margin-top:18px}
.rastdiv{text-align:center;border-top:1px solid var(--line);margin:6px 0 14px;position:relative}
.rastdiv span{position:relative;top:-9px;background:var(--surface);padding:0 12px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}

/* App shell */
#app{min-height:100vh;display:flex;flex-direction:column}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px;
  display:flex;align-items:center;gap:14px;height:58px;position:sticky;top:0;z-index:30}
header .logo{width:36px;height:36px;border-radius:9px;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:19px}
header .title{font-family:Fraunces,serif;font-weight:600;font-size:16px;color:var(--green-d);line-height:1.1}
header .title small{display:block;font-family:Inter;font-weight:500;font-size:11px;color:var(--muted)}
header .spacer{flex:1}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--green-l);color:var(--green-d);font-weight:600}
.pill.assoc{background:#eef3f8;color:var(--blue)}
.userbox{display:flex;align-items:center;gap:9px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);padding:0 12px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:58px;z-index:20}
nav.tabs button{background:none;border:none;padding:13px 15px;color:var(--muted);font-weight:600;font-size:13.5px;
  border-bottom:2.5px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.active{color:var(--green-d);border-bottom-color:var(--green)}

main{flex:1;padding:22px;max-width:1200px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:20px}
.page-head .spacer{flex:1}
.breadcrumb{font-size:12.5px;color:var(--muted);margin-bottom:6px;cursor:pointer}
.breadcrumb:hover{color:var(--green)}

/* Cards & grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.stat{min-width:0}
.stat .v{font-size:26px;font-weight:700;margin-top:6px;font-family:Fraunces,serif;color:var(--green-d);overflow:hidden}
.stat .v.red{color:var(--red)} .stat .v.amber{color:#b57e0e} .stat .v.blue{color:var(--blue)}
.stat .foot{font-size:11.5px;color:var(--muted);margin-top:3px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.panel-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel-head h3{font-size:15px}
.panel-head .spacer{flex:1}
.panel-body{padding:16px}
.panel-body.flush{padding:0}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 14px;background:var(--surface2);color:var(--muted);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);position:sticky;top:0}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--green-l)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.act{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.tag.ok{background:var(--green-l);color:var(--green-d)}
.tag.red{background:var(--red-l);color:var(--red)}
.tag.amber{background:#fdf3dd;color:#946b0d}
.tag.grey{background:#eef0eb;color:var(--muted)}
.tag.blue{background:#eaf2f7;color:var(--blue)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .ic{font-size:32px;opacity:.4}

.linkbtn{background:none;border:none;color:var(--green);font-weight:600;font-size:12.5px;padding:4px 6px;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.linkbtn.red{color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .inp{width:auto;min-width:150px;padding:8px 10px}
.searchbox{position:relative;flex:1;min-width:180px;max-width:320px}
.searchbox .inp{width:100%;padding-left:32px}
.searchbox::before{content:"🔍";position:absolute;left:10px;top:9px;font-size:13px;opacity:.5}

/* Subtabs */
.subtabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.subtabs button{background:none;border:none;padding:9px 13px;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent}
.subtabs button.active{color:var(--green-d);border-bottom-color:var(--green)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(20,30,15,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px;margin:auto}
.modal.wide{max-width:760px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-head h3{font-size:17px}
.modal-head .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.modal-body{padding:20px;max-height:65vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:13.5px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;
  padding:12px 20px;border-radius:10px;font-size:13.5px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
.loading{padding:50px;text-align:center;color:var(--muted)}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}.dl{grid-template-columns:1fr}main{padding:14px}}

.logo-img{height:78px;width:auto;display:block;margin:0 auto 16px}
.logo-hd{height:40px;width:auto;display:block;border-radius:6px}
</style>
</head>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="card">
    <div class="brand">
      <img class="logo-img" id="logoLogin" alt="APROTUNAS">
      <h1>Sistema de Gestão</h1>
      <div class="sub">Associação dos Produtores Rurais de Tunas do Paraná</div>
    </div>
    <form id="loginForm">
      <div class="field"><label>E-mail</label>
        <input class="inp" type="email" id="loginEmail" autocomplete="username" required></div>
      <div class="field"><label>Senha</label>
        <input class="inp" type="password" id="loginPass" autocomplete="current-password" required></div>
      <button class="btn block" type="submit" id="loginBtn">Entrar</button>
      <div class="err" id="loginErr"></div>
    </form>
    <div class="rastbox">
      <div class="rastdiv"><span>consultar rastreabilidade</span></div>
      <form id="rastForm">
        <div style="display:flex;gap:8px">
          <input class="inp" id="rastInp" inputmode="numeric" placeholder="Nº de rastreio (ex.: 2001092026)" style="flex:1">
          <button class="btn" type="submit" style="white-space:nowrap">Ver</button>
        </div>
        <div class="err" id="rastErr"></div>
      </form>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="top">
    <img class="logo-hd" id="logoHeader" alt="APROTUNAS">
    <div class="title">Sistema de Gestão<small>Associação dos Produtores Rurais de Tunas do Paraná</small></div>
    <div class="spacer"></div>
    <div class="userbox">
      <span class="pill" id="rolePill">—</span>
      <div class="avatar" id="avatar">?</div>
      <button class="btn ghost sm" id="logoutBtn">Sair</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"><div class="loading"><div class="spinner"></div>Carregando…</div></main>
</div>

<div id="toast"></div>

/* ================= STATE ================= */
let ME = null;          // linha aprotunas_usuario
let TAB = "inicio";
let CACHE = {};         // caches leves (produtos, projetos)
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

/* ================= HELPERS ================= */
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const NUM = n => (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
function dBR(d){ if(!d) return "—"; const p=String(d).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function today(){ return new Date().toISOString().slice(0,10); }
function cafTag(val){ if(!val) return ''; const dias=Math.round((new Date(val+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
  if(dias<0) return '<span class="tag red">Vencida</span>';
  if(dias<=60) return `<span class="tag amber">Vence em ${dias}d</span>`;
  return '<span class="tag ok">Vigente</span>'; }
function toast(msg,isErr){ const t=$('#toast'); t.textContent=msg; t.className='show'+(isErr?' err':''); setTimeout(()=>t.className='',2600); }
function loading(el){ el.innerHTML='<div class="loading"><div class="spinner"></div>Carregando…</div>'; }
async function db(table){ return sb.from(table); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

const isGestor = ()=> ME && (ME.papel==='gestor'||ME.papel==='diretoria');
const isAssoc  = ()=> ME && ME.papel==='associado';

/* ================= AUTH ================= */
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=$('#loginBtn'), err=$('#loginErr');
  err.textContent=''; btn.disabled=true; btn.textContent='Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email:$('#loginEmail').value.trim(), password:$('#loginPass').value });
  if(error){ err.textContent = error.message==='Invalid login credentials'?'E-mail ou senha inválidos.':error.message; btn.disabled=false; btn.textContent='Entrar'; return; }
  await boot();
});
$('#logoutBtn').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });

// Consulta rápida de rastreabilidade na tela de entrada (abre a página pública)
$('#rastForm').addEventListener('submit', e=>{
  e.preventDefault();
  const err=$('#rastErr'); err.textContent='';
  const num=$('#rastInp').value.trim();
  if(!num){ err.textContent='Digite o número de rastreio.'; return; }
  const base=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
  window.open(base+'rastreio.html?r='+encodeURIComponent(num),'_blank');
});

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); return; }
  // carregar perfil
  const { data:me, error } = await sb.from('aprotunas_usuario').select('*').eq('id',session.user.id).maybeSingle();
  if(error || !me){ toast('Usuário sem perfil vinculado. Fale com o gestor.',true); await sb.auth.signOut(); location.reload(); return; }
  ME = me;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#avatar').textContent = initials(me.nome||me.email);
  $('#rolePill').textContent = me.papel==='gestor'?'Gestor':me.papel==='diretoria'?'Diretoria':'Associado';
  $('#rolePill').className = 'pill'+(isAssoc()?' assoc':'');
  buildTabs();
  go(isAssoc()?'meu-cadastro':'inicio');
}

/* ================= NAV ================= */
const TABS_GESTOR = [
  ['inicio','Início'],['associados','Associados'],['estoque','Recebimento & Estoque'],
  ['financeiro','Financeiro'],['projetos','Projetos'],['relatorios','Relatórios'],['config','Configurações']
];
const TABS_ASSOC = [
  ['meu-cadastro','Meu cadastro'],['meus-documentos','Meus documentos'],
  ['minha-producao','Minha produção'],['minhas-contribuicoes','Minhas contribuições'],
  ['meus-pagamentos','Meus pagamentos']
];
function buildTabs(){
  const list = isAssoc()?TABS_ASSOC:TABS_GESTOR;
  $('#tabs').innerHTML = list.map(([id,lbl])=>`<button data-tab="${id}">${lbl}</button>`).join('');
  $$('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
}
function go(tab){ TAB=tab; $$('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab)); render(); }

const ROUTES = {}; // preenchido abaixo
async function render(){
  const v=$('#view'); loading(v);
  try{ await (ROUTES[TAB]||(()=>{v.innerHTML='<div class="empty">Em breve.</div>'}))(v); }
  catch(err){ console.error(err); v.innerHTML=`<div class="empty">Erro ao carregar: ${esc(err.message||err)}</div>`; }
  requestAnimationFrame(fitStatValues);
}

// Ajusta a fonte dos valores dos cards para nunca estourar o quadro
function fitStatValues(){
  $$('.stat .v').forEach(el=>{
    el.style.whiteSpace='nowrap';
    let fs=parseFloat(el.dataset.baseFs || getComputedStyle(el).fontSize) || 26;
    el.dataset.baseFs=fs;
    el.style.fontSize=fs+'px';
    let guard=40;
    while(el.scrollWidth>el.clientWidth+1 && fs>11 && guard-->0){ fs-=1; el.style.fontSize=fs+'px'; }
  });
}
window.addEventListener('resize',()=>requestAnimationFrame(fitStatValues));

/* ================= CATÁLOGOS ================= */
async function getProdutos(force){ if(!CACHE.produtos||force){ const {data}=await sb.from('aprotunas_produto').select('*').order('nome'); CACHE.produtos=data||[]; } return CACHE.produtos; }
async function getProjetos(force){ if(!CACHE.projetos||force){ const {data}=await sb.from('aprotunas_projeto').select('*').order('nome'); CACHE.projetos=data||[]; } return CACHE.projetos; }
async function getAssociados(force){ if(!CACHE.assoc||force){ const {data}=await sb.from('aprotunas_associado').select('id,nome,status').order('nome'); CACHE.assoc=data||[]; } return CACHE.assoc; }
async function getContas(force){ if(!CACHE.contas||force){ const {data}=await sb.from('aprotunas_conta').select('*').order('nome'); CACHE.contas=data||[]; } return CACHE.contas; }
function prodNome(id){ const p=(CACHE.produtos||[]).find(x=>x.id===id); return p?p.nome:'—'; }
function prodUnid(id){ const p=(CACHE.produtos||[]).find(x=>x.id===id); return p?p.unidade:''; }
function projNome(id){ const p=(CACHE.projetos||[]).find(x=>x.id===id); return p?p.nome:'—'; }
function assocNome(id){ const a=(CACHE.assoc||[]).find(x=>x.id===id); return a?a.nome:'—'; }

/* ================= MODAL / FORM ================= */
function closeModal(){ const o=$('.overlay'); if(o) o.remove(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* fields: [{key,label,type,options,required,step,placeholder,full,help}] type: text|number|date|select|textarea|checkbox */
function openForm({title,fields,values={},onSave,wide,extraHTML}){
  closeModal();
  const body = fields.map(f=>{
    const v = values[f.key] ?? f.default ?? '';
    let ctrl='';
    if(f.type==='select'){
      const opts=(typeof f.options==='function'?f.options():f.options)||[];
      ctrl=`<select class="inp" data-k="${f.key}">${f.required?'':'<option value="">—</option>'}${opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(v)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    } else if(f.type==='textarea'){
      ctrl=`<textarea class="inp" data-k="${f.key}" rows="3" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
    } else if(f.type==='checkbox'){
      ctrl=`<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" data-k="${f.key}" ${v?'checked':''}> ${esc(f.checkLabel||'Sim')}</label>`;
    } else {
      ctrl=`<input class="inp" data-k="${f.key}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} value="${esc(v)}" placeholder="${esc(f.placeholder||'')}">`;
    }
    return `<div class="field ${f.full?'full':''}"><label>${esc(f.label)}${f.required?' *':''}</label>${ctrl}${f.help?`<div style="font-size:11.5px;color:var(--muted);margin-top:4px">${esc(f.help)}</div>`:''}</div>`;
  }).join('');
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal ${wide?'wide':''}">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="x">&times;</button></div>
    <form id="mform"><div class="modal-body"><div class="form-grid">${body}</div>${extraHTML||''}</div>
    <div class="modal-foot"><button type="button" class="btn ghost" data-close>Cancelar</button>
    <button type="submit" class="btn" id="msave">Salvar</button></div></form></div>`;
  document.body.appendChild(o);
  o.addEventListener('click',e=>{ if(e.target===o||e.target.dataset.close!==undefined||e.target.classList.contains('x')) closeModal(); });
  $('#mform',o).addEventListener('submit',async e=>{
    e.preventDefault();
    const out={};
    $$('[data-k]',o).forEach(el=>{
      let val = el.type==='checkbox'?el.checked:el.value;
      if(el.tagName==='SELECT'||el.type!=='checkbox'){ if(val==='') val=null; }
      out[el.dataset.k]=val;
    });
    const missing=fields.find(f=>f.required && (out[f.key]==null||out[f.key]===''));
    if(missing){ toast('Preencha: '+missing.label,true); return; }
    const btn=$('#msave',o); btn.disabled=true; btn.textContent='Salvando…';
    try{ await onSave(out); closeModal(); }
    catch(err){ toast(err.message||'Erro ao salvar',true); btn.disabled=false; btn.textContent='Salvar'; }
  });
}

async function confirmDel(msg,fn){
  if(!confirm(msg)) return;
  try{ await fn(); toast('Excluído.'); }catch(err){ toast(err.message||'Erro',true); }
}

/* helper de tabela */
function tbl(cols, rows, opts={}){
  if(!rows.length) return `<div class="empty"><div class="ic">📭</div><div>${opts.empty||'Nenhum registro.'}</div></div>`;
  return `<div style="overflow-x:auto"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''} ${c.act?'act':''}">${c.h||''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r,i)=>`<tr class="${opts.onRow?'clk':''}" data-i="${i}">${cols.map(c=>`<td class="${c.num?'num':''} ${c.act?'act':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function wireRows(container,rows,onRow){
  if(!onRow) return;
  $$('tbody tr.clk',container).forEach(tr=>tr.addEventListener('click',e=>{
    if(e.target.closest('button')) return;
    onRow(rows[+tr.dataset.i]);
  }));
}

ROUTES.inicio = async (v)=>{
  const [assoc,contrib,estoque,lancRes,proj,docs,cafRes,contasRes] = await Promise.all([
    sb.from('aprotunas_associado').select('status'),
    sb.from('aprotunas_contribuicao').select('valor,data_pagamento,vencimento'),
    sb.from('aprotunas_v_estoque').select('nome,saldo'),
    sb.from('aprotunas_lancamento').select('tipo,valor,data_pagamento'),
    sb.from('aprotunas_projeto').select('status'),
    sb.from('aprotunas_documento').select('data_validade'),
    sb.from('aprotunas_associado').select('caf_validade').not('caf_validade','is',null),
    sb.from('aprotunas_conta').select('saldo_inicial,ativo')
  ]);
  const ativos=(assoc.data||[]).filter(a=>a.status==='ativo').length;
  const inativos=(assoc.data||[]).filter(a=>a.status==='inativo').length;
  const hoje=today();
  const inadimp = new Set((contrib.data||[]).filter(c=>!c.data_pagamento && c.vencimento && c.vencimento<hoje).map(c=>c.associado_id)).size;
  const abertoVal=(contrib.data||[]).filter(c=>!c.data_pagamento).reduce((s,c)=>s+Number(c.valor||0),0);
  const saldoIni=(contasRes.data||[]).filter(c=>c.ativo).reduce((s,c)=>s+Number(c.saldo_inicial||0),0);
  const recL=(lancRes.data||[]).filter(l=>l.tipo==='receita'&&l.data_pagamento).reduce((s,l)=>s+Number(l.valor||0),0);
  const desL=(lancRes.data||[]).filter(l=>l.tipo==='despesa'&&l.data_pagamento).reduce((s,l)=>s+Number(l.valor||0),0);
  const caixa=saldoIni+recL-desL;
  const projAtivos=(proj.data||[]).filter(p=>p.status==='ativo').length;
  const vencidos=(docs.data||[]).filter(d=>d.data_validade && d.data_validade<hoje).length;
  const venc30=(docs.data||[]).filter(d=>{ if(!d.data_validade) return false; const dias=(new Date(d.data_validade)-new Date(hoje))/864e5; return dias>=0&&dias<=30; }).length;
  const cafVenc=(cafRes.data||[]).filter(c=>c.caf_validade<hoje).length;
  const cafProx=(cafRes.data||[]).filter(c=>{ const dias=(new Date(c.caf_validade)-new Date(hoje))/864e5; return dias>=0&&dias<=60; }).length;

  v.innerHTML = `
   <div class="page-head"><div><h2>Painel geral</h2><div style="font-size:13px;color:var(--muted)">Visão consolidada da associação</div></div></div>
   <div class="cards">
     <div class="stat"><div class="k">Associados ativos</div><div class="v">${ativos}</div><div class="foot">${inativos} inativo(s)</div></div>
     <div class="stat"><div class="k">Inadimplentes</div><div class="v ${inadimp?'red':''}">${inadimp}</div><div class="foot">${BRL(abertoVal)} em aberto</div></div>
     <div class="stat"><div class="k">Saldo em caixa</div><div class="v ${caixa<0?'red':'blue'}">${BRL(caixa)}</div><div class="foot">Todas as contas</div></div>
     <div class="stat"><div class="k">Projetos ativos</div><div class="v">${projAtivos}</div><div class="foot">PNAE / PAA / outros</div></div>
     <div class="stat"><div class="k">Docs. vencidos</div><div class="v ${vencidos?'red':''}">${vencidos}</div><div class="foot">${venc30} vence(m) em 30 dias</div></div>
     <div class="stat"><div class="k">CAF a vencer / vencidas</div><div class="v ${(cafProx||cafVenc)?'amber':''}">${cafProx}${cafVenc?` <span style="font-size:15px;color:var(--red)">+${cafVenc}</span>`:''}</div><div class="foot">próx. 60 dias · aviso por e-mail automático</div></div>
   </div>
   <div class="panel"><div class="panel-head"><h3>Estoque atual por produto</h3></div>
     <div class="panel-body flush">${tbl(
       [{h:'Produto',f:r=>esc(r.nome)},{h:'Saldo',num:true,f:r=>`<b>${NUM(r.saldo)}</b>`}],
       (estoque.data||[]).filter(e=>Number(e.saldo)!==0), {empty:'Sem movimentação de estoque ainda.'}
     )}</div></div>`;
};

      {h:'Telefone',f:r=>esc(r.telefone||'—')},
      {h:'Situação',f:r=>r.status==='ativo'?'<span class="tag ok">Ativo</span>':'<span class="tag grey">Inativo</span>'},
    ], list, {onRow:r=>openAssociado(r.id), empty:'Nenhum associado cadastrado.'});

    <div class="page-head"><h2>Associados</h2><div class="spacer"></div>
      <button class="btn" id="novoAssoc">+ Novo associado</button></div>
    <div class="filters"><div class="searchbox"><input class="inp" id="buscaAssoc" placeholder="Buscar por nome, CPF, município…"></div>

    <div class="panel"><div class="panel-body flush" id="listaAssoc">${render(rows)}</div></div>`;
  const apply=()=>{
    const q=$('#buscaAssoc').value.toLowerCase(), st=$('#fStatus').value;
    let list=rows.filter(r=>(!st||r.status===st) && (!q || [r.nome,r.cpf,r.municipio,r.numero_matricula].some(x=>(x||'').toLowerCase().includes(q))));
    const c=$('#listaAssoc'); c.innerHTML=render(list); wireRows(c,list,r=>openAssociado(r.id));
  };

function formAssociado(row){

// Consolida pagamentos ao produtor: anexa comprovante e dá baixa na data escolhida (hoje por padrão)
function consolidarPagamento(a, itens){
  const total=itens.reduce((s,x)=>s+Number(x.valor||0),0);
  closeModal();
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal"><div class="modal-head"><h3>Consolidar pagamento</h3><button class="x">&times;</button></div>
   <form id="cpForm"><div class="modal-body">
     <p style="font-size:14px;margin:0 0 14px">Pagar <b>${itens.length}</b> lançamento(s) — total <b style="color:var(--green-d)">${BRL(total)}</b> — ao produtor <b>${esc(a.nome)}</b>.</p>
     <div class="form-grid">
       <div class="field"><label>Data do pagamento</label><input class="inp" type="date" id="cpData" value="${today()}"></div>
       <div class="field"><label>Forma de pagamento</label><input class="inp" id="cpForma" placeholder="PIX, transferência…"></div>
     </div>
     <div class="field"><label>Comprovante de pagamento (PDF/imagem)</label><input class="inp" type="file" id="cpFile" accept=".pdf,image/*">
       <div style="font-size:11.5px;color:var(--muted);margin-top:4px">Opcional — o mesmo comprovante é anexado a todos os selecionados.</div></div>
   </div>
   <div class="modal-foot"><button type="button" class="btn ghost" data-close>Cancelar</button><button type="submit" class="btn" id="cpSave">Confirmar pagamento</button></div>
   </form></div>`;
  document.body.appendChild(o);
  o.addEventListener('click',e=>{ if(e.target===o||e.target.dataset.close!==undefined||e.target.classList.contains('x')) closeModal(); });
  $('#cpForm',o).addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=$('#cpSave',o); btn.disabled=true; btn.textContent='Salvando…';
    try{
      const dt=$('#cpData',o).value||today();
      const forma=$('#cpForma',o).value||null;
      const file=$('#cpFile',o).files[0];
      let path=null;
      if(file){ const ext=(file.name.split('.').pop()||'pdf'); path=`${a.id}/pagamentos/${Date.now()}.${ext}`;
        const {error:e0}=await sb.storage.from('aprotunas-docs').upload(path,file,{upsert:true}); if(e0) throw e0; }
      const patch={data_pagamento:dt}; if(path) patch.comprovante_path=path; if(forma) patch.observacao=('Pago via '+forma);
      const {error}=await sb.from('aprotunas_lancamento').update(patch).in('id', itens.map(x=>x.id)); if(error) throw error;
      closeModal(); toast('Pagamento registrado e baixado.'); paintAssocSub(a);
    }catch(err){ toast(err.message||'Erro ao pagar',true); btn.disabled=false; btn.textContent='Confirmar pagamento'; }
  });
}
async function uploadDoc(assocId,docId,file){
  const ext=file.name.split('.').pop();
  const path=`${assocId}/${docId}.${ext}`;
  const {error}=await sb.storage.from('aprotunas-docs').upload(path,file,{upsert:true});
  if(error){ toast('Falha no upload: '+error.message,true); return; }
  await sb.from('aprotunas_documento').update({arquivo_path:path}).eq('id',docId);
}
async function uploadComprovante(assocId,contribId,file){
  const ext=(file.name.split('.').pop()||'pdf');
  const path=`${assocId}/contrib/${contribId}.${ext}`;
  const {error}=await sb.storage.from('aprotunas-docs').upload(path,file,{upsert:true});
  if(error){ toast('Falha no upload do comprovante: '+error.message,true); return; }
  await sb.from('aprotunas_contribuicao').update({comprovante_path:path}).eq('id',contribId);
}
async function baixarArquivo(path){
  if(!path){ toast('Sem arquivo',true); return; }
  const {data,error}=await sb.storage.from('aprotunas-docs').createSignedUrl(path,120);
  if(error){ toast('Erro ao abrir arquivo',true); return; }
  window.open(data.signedUrl,'_blank');
}

   <form id="dform"><div class="modal-body">
     <div class="form-grid">
       <div class="field"><label>Data *</label><input class="inp" id="d-data" type="date" value="${row?row.data:today()}"></div>
       <div class="field"><label>Produto *</label><select class="inp" id="d-prod">${prodOpts}</select></div>
       <div class="field"><label>Projeto</label><select class="inp" id="d-proj">${projOpts}</select></div>
       <div class="field"><label>Valor unitário (R$)</label><input class="inp" id="d-vu" type="number" step="0.0001" value="${row?(row.valor_unitario||''):''}"></div>
       <div class="field full"><label>Local de entrega (escola/instituição)</label><input class="inp" id="d-local" value="${row?esc(row.local_entrega||''):''}"></div>
       <div class="field full"><label>Observação</label><textarea class="inp" id="d-obs" rows="2">${row?esc(row.observacao||''):''}</textarea></div>
     </div>
     <div style="margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)">
       <div style="font-weight:600;margin-bottom:4px">Produtores de origem (rastreabilidade)</div>
       <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Marque de quais recebimentos (produtores) sai este produto e a quantidade de cada. O total é somado automaticamente.</div>
       <div id="d-origens"><div class="loading"><div class="spinner"></div></div></div>
     </div>
   </div>
   <div class="modal-foot"><button type="button" class="btn ghost" data-close>Cancelar</button><button type="submit" class="btn" id="dsave">Salvar</button></div>
   </form></div>`;
  document.body.appendChild(o);
  o.addEventListener('click',e=>{ if(e.target===o||e.target.dataset.close!==undefined||e.target.classList.contains('x')) closeModal(); });
  function recalc(){ const el=$('#d-total',o); if(!el) return; let tot=0; $$('.d-qtd',o).forEach(i=>{ const chk=$(`.d-chk[data-rec="${i.dataset.rec}"]`,o); const v=Number(i.value)||0; if(chk&&chk.checked) tot+=v; }); el.textContent=NUM(tot); }
  const loadOrigens=async ()=>{
    const prodId=$('#d-prod',o).value;
    const box=$('#d-origens',o); box.innerHTML='<div class="loading"><div class="spinner"></div></div>';
    const {data:sal}=await sb.from('aprotunas_v_recebimento_saldo').select('*').eq('produto_id',prodId).order('data',{ascending:false});
    const jaMap={}; origExist.forEach(x=>jaMap[x.recebimento_id]=Number(x.quantidade));
    const list=(sal||[]).map(s=>{ const extra=jaMap[s.recebimento_id]||0; return {...s, disp:Number(s.saldo_disponivel)+extra, pre:extra}; })
                        .filter(s=>s.disp>0 || s.pre>0);
    const um=(CACHE.produtos||[]).find(x=>x.id===prodId); const un=$('#d-unid',o); if(un) un.textContent=um?um.unidade:'';
    if(!list.length){ box.innerHTML='<div style="font-size:12.5px;color:var(--muted)">Nenhum recebimento com saldo para este produto. Registre um recebimento deste produto primeiro.</div>'; recalc(); return; }
    box.innerHTML=list.map(s=>`<div style="display:grid;grid-template-columns:22px 1fr 120px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">
       <input type="checkbox" class="d-chk" data-rec="${s.recebimento_id}" ${s.pre?'checked':''}>
       <div style="font-size:12.5px"><b>${esc(s.rastreio||'')}</b> · ${esc(assocNome(s.associado_id))}<div style="color:var(--muted);font-size:11px">disponível: ${NUM(s.disp)} ${esc(s.unidade||'')}</div></div>
       <input type="number" step="0.001" class="inp d-qtd" data-rec="${s.recebimento_id}" data-max="${s.disp}" placeholder="qtd" value="${s.pre||''}" style="padding:6px 8px">
     </div>`).join('');
    $$('.d-chk',box).forEach(c=>c.onchange=recalc);
    $$('.d-qtd',box).forEach(i=>i.oninput=recalc);
    recalc();
  };
  $('#d-prod',o).onchange=()=>{ origExist=[]; loadOrigens(); };
  loadOrigens();
  $('#dform',o).addEventListener('submit',async e=>{
    e.preventDefault();
    const prodId=$('#d-prod',o).value;
    const um=(CACHE.produtos||[]).find(x=>x.id===prodId);
    const origens=[]; let total=0, overflow=false;
    $$('.d-chk',o).forEach(c=>{ if(c.checked){ const el=$(`.d-qtd[data-rec="${c.dataset.rec}"]`,o); const q=Number(el.value)||0;
      if(q>0){ if(q>Number(el.dataset.max)+0.0001) overflow=true; origens.push({recebimento_id:c.dataset.rec,quantidade:q}); total+=q; } } });
    if(!origens.length){ toast('Selecione ao menos um produtor de origem e a quantidade.',true); return; }
    if(overflow){ toast('Há quantidade acima do saldo disponível de algum recebimento.',true); return; }
    const btn=$('#dsave',o); btn.disabled=true; btn.textContent='Salvando…';
    try{
      const payload={ data:$('#d-data',o).value||today(), produto_id:prodId, quantidade:total, unidade:um?um.unidade:'kg',
        valor_unitario:Number($('#d-vu',o).value)||0, projeto_id:$('#d-proj',o).value||null,
        local_entrega:$('#d-local',o).value||null, observacao:$('#d-obs',o).value||null };
      let distId;
      if(isEdit){ const {error}=await sb.from('aprotunas_distribuicao').update(payload).eq('id',row.id); if(error) throw error; distId=row.id;
        await sb.from('aprotunas_distribuicao_origem').delete().eq('distribuicao_id',distId);
      } else { const {data:ins,error}=await sb.from('aprotunas_distribuicao').insert(payload).select().single(); if(error) throw error; distId=ins.id; }
      const orows=origens.map(x=>({distribuicao_id:distId, recebimento_id:x.recebimento_id, quantidade:x.quantidade}));
      const {error:e2}=await sb.from('aprotunas_distribuicao_origem').insert(orows); if(e2) throw e2;
      closeModal(); toast('Distribuição salva com rastreabilidade.'); paintEstoque();
    }catch(err){ toast(err.message||'Erro ao salvar',true); btn.disabled=false; btn.textContent='Salvar'; }
  });
}

/* ---------- Etiqueta + QR do recebimento (impressão) ---------- */
async function etiquetaRecebimento(id){
  const {data:r}=await sb.from('aprotunas_recebimento').select('*').eq('id',id).single();
  if(!r){ toast('Recebimento não encontrado',true); return; }
  await Promise.all([getProdutos(),getAssociados(),getProjetos()]);
  const {data:dists}=await sb.from('aprotunas_distribuicao_origem').select('id,quantidade,aprotunas_distribuicao(data,local_entrega,codigo,unidade,projeto_id)').eq('recebimento_id',id);
  // status de pagamento ao produtor por romaneio (origem)
  const _oids=(dists||[]).map(x=>x.id);
  if(_oids.length){ const {data:_pgs}=await sb.from('aprotunas_lancamento').select('distribuicao_origem_id,data_pagamento').eq('origem','pagamento_produtor').in('distribuicao_origem_id',_oids);
    const _pm={}; (_pgs||[]).forEach(pg=>_pm[pg.distribuicao_origem_id]=pg.data_pagamento);
    (dists||[]).forEach(x=>x._pago=_pm[x.id]||null); }
  const holder=document.createElement('div'); holder.style.display='none'; document.body.appendChild(holder);
  const base=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
  const payload=`${base}rastreio.html?r=${encodeURIComponent(r.rastreio)}`;
  try{ new QRCode(holder,{text:payload,width:230,height:230,correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ toast('Biblioteca de QR indisponível (verifique a conexão).',true); holder.remove(); return; }
  setTimeout(()=>{
    const el=holder.querySelector('canvas')||holder.querySelector('img');
    const qrSrc = el ? (el.tagName==='CANVAS'? el.toDataURL('image/png') : el.src) : '';
    holder.remove(); abrirEtiqueta(r,qrSrc,dists||[]);
  },250);
}

    .qr{text-align:center;margin:6px 0}
    .qr img{width:180px;height:180px}
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    td{padding:3px 2px;border-bottom:1px dashed #e2e7db;vertical-align:top}
    td.k{color:#6b7565;width:40%}
    td.v{font-weight:600;text-align:right}
    .dest{margin-top:10px;border-top:1px solid #cdd5c3;padding-top:8px}
    .dest-h{font-size:10px;letter-spacing:1px;color:#6b7565;text-transform:uppercase;margin-bottom:6px}
    .dest-i{background:#e8f2e4;border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12px;color:#1f5c24}
    .dest-i .m{color:#4a5442;font-weight:400}

    @media print{.noprint{display:none}}
   </style></head><body>
   <div class="etq">
     <div class="hd"><img src="${LOGO_APROTUNAS}"><div class="t"><b>APROTUNAS</b><br>Assoc. dos Produtores Rurais de Tunas do Paraná</div></div>
     <div class="rast"><div class="lbl">Nº de rastreabilidade</div><div class="num">${esc(r.rastreio)}</div></div>
     <div class="qr"><img src="${qrSrc}"></div>
     <table>
       ${linha('Romaneio',esc(r.codigo||'—'))}
       ${linha('Produtor',esc(assocNome(r.associado_id)))}
       ${linha('Produto',esc(prodNome(r.produto_id)))}
       ${linha('Quantidade recebida',NUM(r.quantidade)+' '+esc(prodUnid(r.produto_id)))}
       ${dists.length?linha('Já distribuído',NUM(distribuido)+' '+esc(prodUnid(r.produto_id))):''}
       ${linha('Saldo em estoque',`<b style="color:${saldo<=0?'#c0392b':'#1f5c24'}">${NUM(saldo)} ${esc(prodUnid(r.produto_id))}</b>`)}
       ${r.peso?linha('Peso / Gramagem',esc(r.peso)):''}
       ${linha('Data',dBR(r.data))}
       ${r.projeto_id?linha('Projeto',esc(projNome(r.projeto_id))):''}
     </table>
     ${dists.length?`<div class="dest"><div class="dest-h">🚚 Distribuição / destino</div>
       ${dists.map(x=>{const d=x.aprotunas_distribuicao||{};const pg=x._pago?`<br><span style="color:#1f5c24;font-weight:700">✔ Produtor pago em ${dBR(x._pago)}</span>`:`<br><span style="color:#b57e0e;font-weight:600">Pagamento ao produtor pendente</span>`;return `<div class="dest-i"><b>${esc(d.local_entrega||projNome(d.projeto_id)||'Destino')}</b><br><span class="m">Enviado em ${dBR(d.data)} · ${NUM(x.quantidade)} ${esc(d.unidade||'')}</span>${pg}</div>`;}).join('')}
     </div>`:''}
     <div class="ft">Rastreabilidade APROTUNAS · recebimento → distribuição</div>

let FIN_SUB='lancamentos', FIN_FILTRO='';
ROUTES.financeiro = async (v)=>{
  await Promise.all([getProjetos(),getAssociados(),getContas()]);
  const {data:saldos}=await sb.from('aprotunas_v_saldo_conta').select('*');
  const {data:lancAll}=await sb.from('aprotunas_lancamento').select('tipo,valor,data_pagamento');
  const saldoIni=(CACHE.contas||[]).filter(c=>c.ativo).reduce((s,c)=>s+Number(c.saldo_inicial||0),0);
  const recL=(lancAll||[]).filter(l=>l.tipo==='receita'&&l.data_pagamento).reduce((s,l)=>s+Number(l.valor||0),0);
  const desL=(lancAll||[]).filter(l=>l.tipo==='despesa'&&l.data_pagamento).reduce((s,l)=>s+Number(l.valor||0),0);
  const caixa=saldoIni+recL-desL;
  v.innerHTML=`<div class="page-head"><h2>Financeiro</h2></div>
    <div class="cards">
      <div class="stat"><div class="k">Saldo atual (todas as contas)</div><div class="v ${caixa<0?'red':'blue'}">${BRL(caixa)}</div></div>
      ${(saldos||[]).map(c=>`<div class="stat"><div class="k">${esc(c.nome)}</div><div class="v" style="font-size:20px">${BRL(c.saldo_atual)}</div><div class="foot">Inicial ${BRL(c.saldo_inicial)}</div></div>`).join('')}
    </div>
    <div class="subtabs" id="finSubs">
      <button data-s="lancamentos" class="${FIN_SUB==='lancamentos'?'active':''}">Lançamentos</button>
      <button data-s="pagar" class="${FIN_SUB==='pagar'?'active':''}">Contas a pagar</button>
      <button data-s="receber" class="${FIN_SUB==='receber'?'active':''}">Contas a receber</button>
    </div><div id="finPane"></div>`;
  $$('#finSubs button').forEach(b=>b.onclick=()=>{FIN_SUB=b.dataset.s;$$('#finSubs button').forEach(x=>x.classList.toggle('active',x===b));paintFin();});
  paintFin();
};
function finFields(){return [
  {key:'tipo',label:'Tipo',type:'select',required:true,options:[{value:'receita',label:'Receita'},{value:'despesa',label:'Despesa'}]},
  {key:'origem',label:'Origem',type:'select',options:[{value:'contribuicao',label:'Contribuição'},{value:'pagamento_produtor',label:'Pagamento a produtor'},{value:'recebimento_projeto',label:'Recebimento de projeto'},{value:'despesa_fixa',label:'Despesa fixa'},{value:'despesa_variavel',label:'Despesa variável'},{value:'outro',label:'Outro'}],default:'outro'},
  {key:'descricao',label:'Descrição',required:true,full:true},
  {key:'valor',label:'Valor (R$)',type:'number',step:'0.01',required:true},
  {key:'categoria',label:'Categoria'},
  {key:'conta_id',label:'Conta',type:'select',options:(CACHE.contas||[]).map(x=>({value:x.id,label:x.nome}))},
  {key:'data_vencimento',label:'Vencimento',type:'date'},
  {key:'data_pagamento',label:'Pagamento/Recebimento',type:'date',help:'Em branco = em aberto'},
  {key:'projeto_id',label:'Projeto',type:'select',options:(CACHE.projetos||[]).map(x=>({value:x.id,label:x.nome}))},
  {key:'associado_id',label:'Associado (opcional)',type:'select',options:(CACHE.assoc||[]).map(x=>({value:x.id,label:x.nome}))},
  {key:'observacao',label:'Observação',type:'textarea',full:true},
];}
async function paintFin(){
  const p=$('#finPane'); loading(p);
  if(FIN_SUB==='contas'){
    const {data:rows}=await sb.from('aprotunas_v_saldo_conta').select('*').order('nome');
    const {data:todas}=await sb.from('aprotunas_conta').select('*').order('nome');
    p.innerHTML=`<div class="panel"><div class="panel-head"><h3>Contas e caixa</h3><div class="spacer"></div><button class="btn sm" id="addConta">+ Nova conta</button></div>
      <div class="panel-body flush">${tbl([
        {h:'Conta',f:r=>`<b>${esc(r.nome)}</b>`},{h:'Tipo',f:r=>esc(r.tipo)},
        {h:'Saldo inicial',num:true,f:r=>BRL(r.saldo_inicial)},
        {h:'Receitas',num:true,f:r=>BRL(r.receitas)},{h:'Despesas',num:true,f:r=>BRL(r.despesas)},
        {h:'Saldo atual',num:true,f:r=>`<b>${BRL(r.saldo_atual)}</b>`},
      ],rows,{empty:'Nenhuma conta.'})}</div></div>`;
    const fields=[{key:'nome',label:'Nome',required:true,full:true},{key:'tipo',label:'Tipo',type:'select',options:[{value:'banco',label:'Banco'},{value:'caixa',label:'Caixa'}],default:'banco'},{key:'saldo_inicial',label:'Saldo inicial (R$)',type:'number',step:'0.01',default:0}];
    $('#addConta').onclick=()=>openForm({title:'Nova conta',fields,onSave:async o=>{const{error}=await sb.from('aprotunas_conta').insert(o);if(error)throw error;CACHE.contas=null;toast('Conta criada.');paintFin();}});
    return;
  }
  // lançamentos / pagar / receber
  let query=sb.from('aprotunas_lancamento').select('*').order('data_vencimento',{ascending:false,nullsFirst:false}).limit(400);
  if(FIN_SUB==='pagar') query=query.eq('tipo','despesa').is('data_pagamento',null);
  if(FIN_SUB==='receber') query=query.eq('tipo','receita').is('data_pagamento',null);
  const {data:rows}=await query;
  const total=rows.reduce((s,r)=>s+(r.tipo==='receita'?1:-1)*Number(r.valor||0),0);
  const abertoLbl=FIN_SUB==='pagar'?'Total a pagar':FIN_SUB==='receber'?'Total a receber':'Resultado (receitas − despesas)';
  const abertoVal=FIN_SUB==='lancamentos'?total:rows.reduce((s,r)=>s+Number(r.valor||0),0);
  const stTag=r=>r.data_pagamento?'<span class="tag ok">Liquidado</span>':(r.data_vencimento&&r.data_vencimento<today()?'<span class="tag red">Vencido</span>':'<span class="tag amber">Em aberto</span>');
  p.innerHTML=`<div class="panel"><div class="panel-head"><h3>${FIN_SUB==='pagar'?'Contas a pagar':FIN_SUB==='receber'?'Contas a receber':'Lançamentos'}</h3>
      <div class="spacer"></div><span style="font-size:12.5px;color:var(--muted)">${abertoLbl}: <b style="color:${abertoVal<0?'var(--red)':'var(--green-d)'}">${BRL(abertoVal)}</b></span>
      <button class="btn sm" id="addLanc">+ Lançar</button></div>
    <div class="panel-body flush">${tbl([
      {h:'Descrição',f:r=>`<b>${esc(r.descricao)}</b>${r.categoria?`<div style="font-size:11.5px;color:var(--muted)">${esc(r.categoria)}</div>`:''}`},
      {h:'Tipo',f:r=>r.tipo==='receita'?'<span class="tag ok">Receita</span>':'<span class="tag red">Despesa</span>'},
      {h:'Valor',num:true,f:r=>BRL(r.valor)},
      {h:'Vencimento',f:r=>dBR(r.data_vencimento)},
      {h:'Projeto',f:r=>r.projeto_id?esc(projNome(r.projeto_id)):'—'},
      {h:'Situação',f:r=>stTag(r)},
      {act:true,f:r=>`${r.data_pagamento?`<button class="linkbtn" data-reab="${r.id}">Reabrir</button>`:`<button class="linkbtn" data-liq="${r.id}">Liquidar</button>`}<button class="linkbtn" data-ed="${r.id}">Editar</button><button class="linkbtn red" data-del="${r.id}">Excluir</button>`}
    ],rows,{empty:'Nenhum lançamento.'})}</div></div>`;
  const preset=FIN_SUB==='pagar'?{tipo:'despesa'}:FIN_SUB==='receber'?{tipo:'receita'}:{};
  $('#addLanc').onclick=()=>openForm({title:'Novo lançamento',wide:true,fields:finFields(),values:preset,onSave:async o=>{const{error}=await sb.from('aprotunas_lancamento').insert(o);if(error)throw error;toast('Lançado.');paintFin();}});
  $$('[data-ed]',p).forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id===b.dataset.ed);openForm({title:'Editar lançamento',wide:true,fields:finFields(),values:r,onSave:async o=>{const{error}=await sb.from('aprotunas_lancamento').update(o).eq('id',r.id);if(error)throw error;toast('Salvo.');paintFin();}});});
  $$('[data-liq]',p).forEach(b=>b.onclick=async()=>{await sb.from('aprotunas_lancamento').update({data_pagamento:today()}).eq('id',b.dataset.liq);toast('Liquidado.');paintFin();});
  $$('[data-reab]',p).forEach(b=>b.onclick=async()=>{await sb.from('aprotunas_lancamento').update({data_pagamento:null}).eq('id',b.dataset.reab);paintFin();});
  $$('[data-del]',p).forEach(b=>b.onclick=()=>confirmDel('Excluir lançamento?',async()=>{await sb.from('aprotunas_lancamento').delete().eq('id',b.dataset.del);paintFin();}));
}

  v.innerHTML=`<div class="page-head"><h2>Projetos</h2><div class="spacer"></div><button class="btn" id="novoProj">+ Novo projeto</button></div>
    <div class="panel"><div class="panel-body flush">${tbl([

    ],exec,{onRow:r=>openProjeto(r.projeto_id),empty:'Nenhum projeto cadastrado.'})}</div></div>`;

};
function projFields(){return [
  {key:'nome',label:'Nome do projeto',required:true,full:true},
  {key:'tipo',label:'Tipo',type:'select',required:true,options:[{value:'PNAE',label:'PNAE'},{value:'PAA',label:'PAA'},{value:'outro',label:'Outro'}],default:'PNAE'},
  {key:'contratante',label:'Contratante (prefeitura/entidade)'},
  {key:'valor_global',label:'Valor global (R$)',type:'number',step:'0.01',default:0},
  {key:'data_inicio',label:'Início',type:'date'},{key:'data_fim',label:'Fim',type:'date'},
  {key:'status',label:'Situação',type:'select',options:[{value:'ativo',label:'Ativo'},{value:'encerrado',label:'Encerrado'},{value:'suspenso',label:'Suspenso'}],default:'ativo'},
  {key:'descricao',label:'Descrição',type:'textarea',full:true},
];}
function formProjeto(row){
  openForm({title:row?'Editar projeto':'Novo projeto',wide:true,fields:projFields(),values:row||{},onSave:async o=>{
    if(row){const{error}=await sb.from('aprotunas_projeto').update(o).eq('id',row.id);if(error)throw error;CACHE.projetos=null;toast('Salvo.');openProjeto(row.id);}
    else{const{data,error}=await sb.from('aprotunas_projeto').insert(o).select().single();if(error)throw error;CACHE.projetos=null;toast('Projeto criado.');openProjeto(data.id);}

async function openProjeto(id){
  TAB='projetos'; $$('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='projetos'));
  const v=$('#view'); loading(v);
  await getProdutos();
  const [{data:pr},{data:ex},{data:itens}]=await Promise.all([
    sb.from('aprotunas_projeto').select('*').eq('id',id).single(),
    sb.from('aprotunas_v_projeto_exec').select('*').eq('projeto_id',id).maybeSingle(),
    sb.from('aprotunas_projeto_item').select('*').eq('projeto_id',id)
  ]);
  const e=ex||{};
  v.innerHTML=`
    <div class="breadcrumb" id="bcProj">← Projetos</div>
    <div class="page-head"><div><h2>${esc(pr.nome)}</h2><div style="font-size:13px;color:var(--muted)"><span class="tag blue">${esc(pr.tipo)}</span> ${pr.contratante?'· '+esc(pr.contratante):''}</div></div>
      <div class="spacer"></div><button class="btn ghost sm" id="edProj">Editar</button> <button class="btn danger sm" id="delProj">Excluir</button></div>
    <div class="cards">
      <div class="stat"><div class="k">Valor global</div><div class="v" style="font-size:20px">${BRL(pr.valor_global)}</div></div>
      <div class="stat"><div class="k">Recebido</div><div class="v blue" style="font-size:20px">${BRL(e.valor_recebido)}</div><div class="foot">Pago: ${BRL(e.valor_pago)}</div></div>
      <div class="stat"><div class="k">Execução física</div><div class="v" style="font-size:20px">${NUM(e.pct_fisico||0)}%</div><div class="foot">${NUM(e.qtd_entregue||0)} de ${NUM(e.qtd_contratada||0)}</div></div>
      <div class="stat"><div class="k">Execução financeira</div><div class="v" style="font-size:20px">${NUM(e.pct_financeiro||0)}%</div></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>Itens contratados</h3><div class="spacer"></div><button class="btn sm" id="addItem">+ Item</button></div>
      <div class="panel-body flush" id="itensPane"></div></div>`;
  requestAnimationFrame(fitStatValues);
  $('#bcProj').onclick=()=>go('projetos');
  $('#edProj').onclick=()=>formProjeto(pr);
  $('#delProj').onclick=()=>confirmDel(`Excluir o projeto "${pr.nome}"?`,async()=>{const{error}=await sb.from('aprotunas_projeto').delete().eq('id',id);if(error)throw error;CACHE.projetos=null;go('projetos');});
  const paintItens=async()=>{
    const {data:its}=await sb.from('aprotunas_projeto_item').select('*').eq('projeto_id',id);
    const {data:entregas}=await sb.from('aprotunas_distribuicao').select('produto_id,quantidade').eq('projeto_id',id);
    const entMap={}; (entregas||[]).forEach(x=>entMap[x.produto_id]=(entMap[x.produto_id]||0)+Number(x.quantidade));
    $('#itensPane').innerHTML=tbl([
      {h:'Produto',f:r=>esc(prodNome(r.produto_id))},
      {h:'Contratado',num:true,f:r=>`${NUM(r.quantidade_contratada)} ${esc(r.unidade||'')}`},
      {h:'Entregue',num:true,f:r=>NUM(entMap[r.produto_id]||0)},
      {h:'Saldo',num:true,f:r=>{const s=Number(r.quantidade_contratada)-(entMap[r.produto_id]||0);return `<b style="color:${s<0?'var(--red)':'inherit'}">${NUM(s)}</b>`;}},
      {h:'Vlr unit.',num:true,f:r=>BRL(r.valor_unitario)},
      {h:'Vlr total',num:true,f:r=>BRL(Number(r.quantidade_contratada)*Number(r.valor_unitario))},
      {act:true,f:r=>`<button class="linkbtn" data-ed="${r.id}">Editar</button><button class="linkbtn red" data-del="${r.id}">Excluir</button>`}
    ],its,{empty:'Nenhum item contratado.'});
    const fields=()=>[{key:'produto_id',label:'Produto',type:'select',required:true,options:(CACHE.produtos||[]).map(x=>({value:x.id,label:x.nome}))},
      {key:'quantidade_contratada',label:'Quantidade contratada',type:'number',step:'0.001',required:true},
      {key:'unidade',label:'Unidade',type:'select',options:['kg','un','dz','L','mç','t'].map(u=>({value:u,label:u})),default:'kg'},
      {key:'valor_unitario',label:'Valor unitário (R$)',type:'number',step:'0.0001',default:0}];
    const checkGlobal=(o,editId)=>{ const g=Number(pr.valor_global)||0; if(g<=0) return;
      const outros=(its||[]).filter(x=>x.id!==editId).reduce((s,x)=>s+Number(x.quantidade_contratada||0)*Number(x.valor_unitario||0),0);
      const novo=(Number(o.quantidade_contratada)||0)*(Number(o.valor_unitario)||0);
      if(outros+novo>g+0.001){ throw new Error(`O total dos itens (${BRL(outros+novo)}) passa do valor global do projeto (${BRL(g)}). Ajuste a quantidade/preço ou aumente o valor global.`); } };
    $('#addItem').onclick=()=>openForm({title:'Novo item',fields:fields(),onSave:async o=>{checkGlobal(o,null);o.projeto_id=id;const{error}=await sb.from('aprotunas_projeto_item').insert(o);if(error)throw error;toast('Item adicionado.');paintItens();}});
    $$('#itensPane [data-ed]').forEach(b=>b.onclick=()=>{const r=its.find(x=>x.id===b.dataset.ed);openForm({title:'Editar item',fields:fields(),values:r,onSave:async o=>{checkGlobal(o,r.id);const{error}=await sb.from('aprotunas_projeto_item').update(o).eq('id',r.id);if(error)throw error;toast('Salvo.');paintItens();}});});
    $$('#itensPane [data-del]').forEach(b=>b.onclick=()=>confirmDel('Excluir item?',async()=>{await sb.from('aprotunas_projeto_item').delete().eq('id',b.dataset.del);paintItens();}));
  };
  paintItens();
}

// Relatório consolidado (imprime / salva em PDF)
async function relatorioConsolidado(){
  const de=REL_DE||('1900-01-01'), ate=REL_ATE||today();
  toast('Montando relatório…');
  await Promise.all([getProdutos(),getProjetos(),getAssociados()]);
  const dentro=d=>d && d>=de && d<=ate;
  const [assoc,estoque,receb,dist,lanc,proj,assoc2] = await Promise.all([
    sb.from('aprotunas_associado').select('status'),
    sb.from('aprotunas_v_estoque').select('*').order('nome'),
    sb.from('aprotunas_recebimento').select('*').order('data'),
    sb.from('aprotunas_distribuicao').select('*').order('data'),
    sb.from('aprotunas_lancamento').select('*'),
    sb.from('aprotunas_v_projeto_exec').select('*').order('nome'),
    sb.from('aprotunas_associacao').select('*').limit(1).single()
  ]);
  const ac=assoc2.data||{};
  const ativos=(assoc.data||[]).filter(a=>a.status==='ativo').length;
  const inativos=(assoc.data||[]).filter(a=>a.status==='inativo').length;
  const recP=(receb.data||[]).filter(r=>dentro(r.data));
  const distP=(dist.data||[]).filter(d=>dentro(d.data));
  const lancL=(lanc.data||[]).filter(l=>l.data_pagamento); // liquidados
  const fluxoP=lancL.filter(l=>dentro(l.data_pagamento));
  const entradas=fluxoP.filter(l=>l.tipo==='receita').reduce((s,l)=>s+Number(l.valor||0),0);
  const saidas=fluxoP.filter(l=>l.tipo==='despesa').reduce((s,l)=>s+Number(l.valor||0),0);
  const saldoIniC=0; // saldo de caixa global
  const caixa=(lanc.data||[]).filter(l=>l.data_pagamento).reduce((s,l)=>s+(l.tipo==='receita'?1:-1)*Number(l.valor||0),0);
  const aPagar=(lanc.data||[]).filter(l=>l.tipo==='despesa'&&!l.data_pagamento);
  const aReceber=(lanc.data||[]).filter(l=>l.tipo==='receita'&&!l.data_pagamento);
  const pagProdAberto=(lanc.data||[]).filter(l=>l.origem==='pagamento_produtor'&&!l.data_pagamento);
  const pagProdPagoP=(lanc.data||[]).filter(l=>l.origem==='pagamento_produtor'&&dentro(l.data_pagamento));
  const somaV=arr=>arr.reduce((s,x)=>s+Number(x.valor||0),0);

  // agrega recebimentos por produtor
  const recPorProd={}; recP.forEach(r=>{const m=recPorProd[r.associado_id]=recPorProd[r.associado_id]||{q:0,n:0};m.q+=Number(r.quantidade||0);m.n+=1;});

  const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const num=n=>(Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
  const d2=d=>{if(!d)return'—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;};
  const ptab=(cols,rows,vazio)=>rows.length?`<table><thead><tr>${cols.map(c=>`<th class="${c.n?'r':''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'r':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:`<p class="vazio">${vazio||'Sem dados no período.'}</p>`;

  const w=window.open('','_blank');
  if(!w){ toast('Permita pop-ups para gerar o PDF.',true); return; }
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório Consolidado APROTUNAS</title>
   <style>
    *{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}

    .top img{height:52px}
    .top h1{font-size:18px;color:#1f5c24;margin:0}
    .top .sub{font-size:11px;color:#6b7565}
    .meta{font-size:11px;color:#6b7565;margin-bottom:16px}
    h2{font-size:13px;color:#1f5c24;border-bottom:1px solid #cdd5c3;padding-bottom:4px;margin:20px 0 8px}
    .kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
    .kpi{border:1px solid #e2e7db;border-radius:8px;padding:8px 12px;min-width:150px}
    .kpi .k{font-size:10px;color:#6b7565;text-transform:uppercase;letter-spacing:.3px}
    .kpi .v{font-size:16px;font-weight:700;color:#1f5c24}
    table{width:100%;border-collapse:collapse;margin-top:6px}
    th,td{border-bottom:1px solid #eee;padding:5px 7px;text-align:left;font-size:11px}
    th{background:#eef3ea;color:#4a5442;font-size:10px;text-transform:uppercase}
    td.r,th.r{text-align:right}
    .vazio{color:#8a9280;font-size:11px;font-style:italic}
    .foot{margin-top:24px;border-top:1px solid #cdd5c3;padding-top:8px;font-size:10px;color:#8a9280;text-align:center}
    .noprint{position:fixed;top:12px;right:12px}
    .noprint button{padding:8px 16px;border:none;border-radius:8px;background:#2e7d32;color:#fff;font-weight:700;cursor:pointer}
    @media print{.noprint{display:none} body{padding:12px}}
   </style></head><body>
   <div class="noprint"><button onclick="window.print()">🖨️ Salvar como PDF / Imprimir</button></div>

   <div class="meta">Período: <b>${d2(de)}</b> a <b>${d2(ate)}</b> · Emitido em ${d2(today())}</div>

   <h2>Resumo</h2>
   <div class="kpis">
     <div class="kpi"><div class="k">Associados ativos</div><div class="v">${ativos}</div></div>
     <div class="kpi"><div class="k">Saldo em caixa</div><div class="v">${money(caixa)}</div></div>

function relTable(title,cols,rows){
  const out=$('#relOut');
  const csv=[cols.map(c=>c.h).join(';'),...rows.map(r=>cols.map(c=>String(c.raw?c.raw(r):c.f(r)).replace(/<[^>]+>/g,'')).join(';'))].join('\n');
  out.innerHTML=`<div class="panel"><div class="panel-head"><h3>${esc(title)}</h3><div class="spacer"></div>
    <span style="font-size:12px;color:var(--muted)">${rows.length} registro(s)</span>
    <button class="btn sm" id="csvBtn">⬇ CSV</button></div>
    <div class="panel-body flush">${tbl(cols,rows,{empty:'Sem dados.'})}</div></div>`;
  out.scrollIntoView({behavior:'smooth',block:'nearest'});
  $('#csvBtn').onclick=()=>{const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title.replace(/[^\w]+/g,'_')+'.csv';a.click();};
}
async function runRelatorio(id,title){
  const out=$('#relOut'); loading(out);
  const hoje=today();
  const de=REL_DE||null, ate=REL_ATE||null;
  const periodoTxt=(de&&ate)?` · período ${dBR(de)} a ${dBR(ate)}`:'';
  if(id==='assoc_relacao'){
    const {data}=await sb.from('aprotunas_associado').select('*').order('nome');
    relTable(title,[{h:'Nome',f:r=>esc(r.nome)},{h:'CPF',f:r=>esc(r.cpf||'—')},{h:'Município',f:r=>esc(r.municipio||'—')},{h:'Telefone',f:r=>esc(r.telefone||'—')},{h:'Situação',f:r=>r.status}],data);
  }
  else if(id==='assoc_inadimplentes'){
    const {data:c}=await sb.from('aprotunas_contribuicao').select('associado_id,valor,vencimento,data_pagamento');
    await getAssociados();
    const map={}; (c||[]).filter(x=>!x.data_pagamento&&x.vencimento&&x.vencimento<hoje).forEach(x=>{map[x.associado_id]=(map[x.associado_id]||0)+Number(x.valor||0);});
    const rows=Object.keys(map).map(k=>({nome:assocNome(k),total:map[k]})).sort((a,b)=>b.total-a.total);
    relTable(title,[{h:'Associado',f:r=>esc(r.nome)},{h:'Total em atraso',num:true,f:r=>BRL(r.total),raw:r=>r.total}],rows);
  }
  else if(id==='assoc_docs_venc'){
    const {data}=await sb.from('aprotunas_documento').select('*').not('data_validade','is',null).order('data_validade');
    const {data:cafs}=await sb.from('aprotunas_associado').select('nome,caf_numero,caf_validade').not('caf_validade','is',null);
    await getAssociados();
    let rows=(data||[]).filter(d=>{const dias=(new Date(d.data_validade)-new Date(hoje))/864e5;return dias<=60;})
      .map(d=>({associado:assocNome(d.associado_id),documento:d.tipo,validade:d.data_validade}));
    (cafs||[]).forEach(c=>{const dias=(new Date(c.caf_validade)-new Date(hoje))/864e5; if(dias<=60) rows.push({associado:c.nome,documento:'CAF'+(c.caf_numero?' '+c.caf_numero:''),validade:c.caf_validade});});
    rows.sort((a,b)=>a.validade<b.validade?-1:1);
    relTable(title,[{h:'Associado',f:r=>esc(r.associado)},{h:'Documento',f:r=>esc(r.documento)},{h:'Validade',f:r=>dBR(r.validade)},{h:'Situação',f:r=>r.validade<hoje?'<span class="tag red">Vencido</span>':'<span class="tag amber">A vencer</span>',raw:r=>r.validade<hoje?'Vencido':'A vencer'}],rows);
  }
  else if(id==='prod_estoque'){
    const {data}=await sb.from('aprotunas_v_estoque').select('*').order('nome');
    relTable(title,[{h:'Produto',f:r=>esc(r.nome)},{h:'Un.',f:r=>esc(r.unidade)},{h:'Inicial',num:true,f:r=>NUM(r.estoque_inicial)},{h:'Entradas',num:true,f:r=>NUM(r.entradas)},{h:'Saídas',num:true,f:r=>NUM(r.saidas)},{h:'Saldo',num:true,f:r=>NUM(r.saldo)}],data);
  }
  else if(id==='prod_receb'){
    let q=sb.from('aprotunas_recebimento').select('associado_id,quantidade,data');
    if(de) q=q.gte('data',de); if(ate) q=q.lte('data',ate);
    const {data}=await q;
    await getAssociados();
    const map={}; (data||[]).forEach(x=>{const m=map[x.associado_id]=map[x.associado_id]||{q:0,n:0};m.q+=Number(x.quantidade||0);m.n+=1;});
    const rows=Object.keys(map).map(k=>({nome:assocNome(k),...map[k]})).sort((a,b)=>b.q-a.q);
    relTable(title+periodoTxt,[{h:'Produtor',f:r=>esc(r.nome)},{h:'Recebimentos',num:true,f:r=>r.n,raw:r=>r.n},{h:'Qtd total',num:true,f:r=>NUM(r.q),raw:r=>r.q}],rows);
  }
  else if(id==='prod_rastreio'){
    await Promise.all([getAssociados(),getProdutos(),getProjetos()]);
    let qr=sb.from('aprotunas_v_recebimento_saldo').select('*').order('data',{ascending:false});
    if(de) qr=qr.gte('data',de); if(ate) qr=qr.lte('data',ate);
    const {data:recs}=await qr;
    // destinos por recebimento
    let destMap={};
    const {data:origs}=await sb.from('aprotunas_distribuicao_origem').select('recebimento_id,quantidade,aprotunas_distribuicao(data,local_entrega,projeto_id,codigo)');
    (origs||[]).forEach(o=>{ (destMap[o.recebimento_id]=destMap[o.recebimento_id]||[]).push(o); });
    const rows=(recs||[]).map(r=>{
      const ds=destMap[r.recebimento_id]||[];
      const mes=r.data?dBR(r.data).slice(3):'—';
      const destinos=ds.map(d=>`${d.aprotunas_distribuicao?.local_entrega||projNome(d.aprotunas_distribuicao?.projeto_id)||'—'} (${NUM(d.quantidade)})`).join('; ');
      return { rastreio:r.rastreio, mes, produtor:assocNome(r.associado_id), produto:prodNome(r.produto_id),
               projeto:projNome(r.projeto_id), recebido:Number(r.quantidade), distribuido:Number(r.distribuido),
               saldo:Number(r.saldo_disponivel), destinos:destinos||'—' };
    }).sort((a,b)=> (a.mes<b.mes?1:a.mes>b.mes?-1:0) || (a.projeto>b.projeto?1:-1) || (a.produtor>b.produtor?1:-1));
    relTable(title+periodoTxt,[
      {h:'Mês',f:r=>esc(r.mes)},
      {h:'Rastreio',f:r=>`<b>${esc(r.rastreio)}</b>`},
      {h:'Produtor',f:r=>esc(r.produtor)},
      {h:'Produto',f:r=>esc(r.produto)},
      {h:'Projeto',f:r=>esc(r.projeto)},
      {h:'Recebido',num:true,f:r=>NUM(r.recebido),raw:r=>r.recebido},
      {h:'Distribuído',num:true,f:r=>NUM(r.distribuido),raw:r=>r.distribuido},
      {h:'Saldo',num:true,f:r=>NUM(r.saldo),raw:r=>r.saldo},
      {h:'Destinos',f:r=>esc(r.destinos)},
    ],rows);
  }
  else if(id==='fin_pagar'||id==='fin_receber'){
    const tipo=id==='fin_pagar'?'despesa':'receita';
    const {data}=await sb.from('aprotunas_lancamento').select('*').eq('tipo',tipo).is('data_pagamento',null).order('data_vencimento');
    relTable(title,[{h:'Descrição',f:r=>esc(r.descricao)},{h:'Valor',num:true,f:r=>BRL(r.valor),raw:r=>r.valor},{h:'Vencimento',f:r=>dBR(r.data_vencimento)},{h:'Projeto',f:r=>esc(projNome(r.projeto_id))}],data);
  }
  else if(id==='fin_fluxo'){
    let qf=sb.from('aprotunas_lancamento').select('*').not('data_pagamento','is',null).order('data_pagamento',{ascending:false}).limit(1000);
    if(de) qf=qf.gte('data_pagamento',de); if(ate) qf=qf.lte('data_pagamento',ate);
    const {data}=await qf;
    const entradas=(data||[]).filter(r=>r.tipo==='receita').reduce((s,r)=>s+Number(r.valor||0),0);
    const saidas=(data||[]).filter(r=>r.tipo==='despesa').reduce((s,r)=>s+Number(r.valor||0),0);
    relTable(title+periodoTxt+` · entradas ${BRL(entradas)} · saídas ${BRL(saidas)} · saldo ${BRL(entradas-saidas)}`,[{h:'Data',f:r=>dBR(r.data_pagamento)},{h:'Descrição',f:r=>esc(r.descricao)},{h:'Tipo',f:r=>r.tipo},{h:'Valor',num:true,f:r=>(r.tipo==='despesa'?'-':'')+BRL(r.valor),raw:r=>(r.tipo==='despesa'?-1:1)*Number(r.valor)}],data);
  }
  else if(id==='proj_exec'){
    const {data}=await sb.from('aprotunas_v_projeto_exec').select('*').order('nome');
    relTable(title,[{h:'Projeto',f:r=>esc(r.nome)},{h:'Tipo',f:r=>r.tipo},{h:'Global',num:true,f:r=>BRL(r.valor_global),raw:r=>r.valor_global},{h:'Recebido',num:true,f:r=>BRL(r.valor_recebido),raw:r=>r.valor_recebido},{h:'% físico',num:true,f:r=>NUM(r.pct_fisico)+'%'},{h:'% financ.',num:true,f:r=>NUM(r.pct_financeiro)+'%'}],data);
  }
}

    <div class="subtabs" id="cfgSubs">
      <button data-s="produtos" class="${CFG_SUB==='produtos'?'active':''}">Produtos</button>

};
async function paintCfg(){
  const p=$('#cfgPane'); loading(p);
  if(CFG_SUB==='produtos'){
    const {data:rows}=await sb.from('aprotunas_produto').select('*').order('nome');
    p.innerHTML=`<div class="panel"><div class="panel-head"><h3>Catálogo de produtos</h3><div class="spacer"></div><button class="btn sm" id="addProd">+ Produto</button></div>
      <div class="panel-body flush">${tbl([
        {h:'Produto',f:r=>`<b>${esc(r.nome)}</b>`},{h:'Unidade',f:r=>esc(r.unidade)},{h:'Categoria',f:r=>esc(r.categoria||'—')},
        {h:'Estoque inicial',num:true,f:r=>NUM(r.estoque_inicial)},
        {h:'Ativo',f:r=>r.ativo?'<span class="tag ok">Sim</span>':'<span class="tag grey">Não</span>'},
        {act:true,f:r=>`<button class="linkbtn" data-ed="${r.id}">Editar</button>`}
      ],rows,{empty:'Nenhum produto.'})}</div></div>`;
    const fields=[{key:'nome',label:'Nome',required:true,full:true},
      {key:'unidade',label:'Unidade',type:'select',options:['kg','un','dz','L','mç','t'].map(u=>({value:u,label:u})),default:'kg'},
      {key:'categoria',label:'Categoria'},
      {key:'estoque_inicial',label:'Estoque inicial',type:'number',step:'0.001',default:0},
      {key:'ativo',label:'Ativo',type:'checkbox',checkLabel:'Produto ativo',default:true}];
    $('#addProd').onclick=()=>openForm({title:'Novo produto',fields,onSave:async o=>{const{error}=await sb.from('aprotunas_produto').insert(o);if(error)throw error;CACHE.produtos=null;toast('Produto criado.');paintCfg();}});
    $$('[data-ed]',p).forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id===b.dataset.ed);openForm({title:'Editar produto',fields,values:r,onSave:async o=>{const{error}=await sb.from('aprotunas_produto').update(o).eq('id',r.id);if(error)throw error;CACHE.produtos=null;toast('Salvo.');paintCfg();}});});
    return;
  }
  if(CFG_SUB==='associacao'){
    const {data:a}=await sb.from('aprotunas_associacao').select('*').limit(1).single();
    p.innerHTML=`<div class="panel"><div class="panel-head"><h3>Dados da associação</h3><div class="spacer"></div><button class="btn sm" id="edAssociacao">Editar</button></div>
      <div class="panel-body"><dl class="dl">
        <dt>Nome</dt><dd>${esc(a.nome)}</dd><dt>CNPJ</dt><dd>${esc(a.cnpj||'—')}</dd>
        <dt>Município</dt><dd>${esc(a.municipio||'—')}/${esc(a.uf||'')}</dd>
        <dt>SIM</dt><dd>${esc(a.sim||'—')}</dd><dt>Telefone</dt><dd>${esc(a.telefone||'—')}</dd>
        <dt>E-mail</dt><dd>${esc(a.email||'—')}</dd><dt>Endereço</dt><dd>${esc(a.endereco||'—')}</dd>
      </dl></div></div>`;
    $('#edAssociacao').onclick=()=>openForm({title:'Dados da associação',wide:true,values:a,fields:[
      {key:'nome',label:'Nome',required:true,full:true},{key:'cnpj',label:'CNPJ'},{key:'sim',label:'SIM'},
      {key:'municipio',label:'Município'},{key:'uf',label:'UF',default:'PR'},
      {key:'telefone',label:'Telefone'},{key:'email',label:'E-mail'},{key:'endereco',label:'Endereço',full:true}
    ],onSave:async o=>{const{error}=await sb.from('aprotunas_associacao').update(o).eq('id',a.id);if(error)throw error;toast('Salvo.');paintCfg();}});
    return;
  }
}

ROUTES['meus-documentos'] = async (v)=>{

  if(!id){ v.innerHTML='<div class="empty">Login não vinculado.</div>'; return; }
  const {data:rows}=await sb.from('aprotunas_documento').select('*').eq('associado_id',id).order('categoria');

  const stTag=r=>!r.data_validade?'<span class="tag grey">Sem validade</span>':(r.data_validade<hoje?'<span class="tag red">Vencido</span>':'<span class="tag ok">Vigente</span>');

    <div class="panel"><div class="panel-body flush">${tbl([
      {h:'Documento',f:r=>esc(r.tipo)},{h:'Categoria',f:r=>esc(r.categoria)},{h:'Validade',f:r=>dBR(r.data_validade)},{h:'Situação',f:r=>stTag(r)},

ROUTES['minha-producao'] = async (v)=>{

    ],rows,{empty:'Nenhum pagamento ainda.'})}</div></div>`;
  requestAnimationFrame(fitStatValues);
};
